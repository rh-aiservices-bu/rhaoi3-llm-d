apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen
  namespace: llmd-xeon
  annotations:
    opendatahub.io/model-type: generative
    openshift.io/display-name: qwen
    security.opendatahub.io/enable-auth: 'false'
spec:
  replicas: 4
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
    criticality: Critical
  router:
    scheduler:
      template:
        containers:
          - name: main
            env:
              - name: TOKENIZER_CACHE_DIR
                value: /tmp/tokenizer-cache
              - name: HF_HOME
                value: /tmp/tokenizer-cache
              - name: TRANSFORMERS_CACHE
                value: /tmp/tokenizer-cache
              - name: XDG_CACHE_HOME
                value: /tmp
            args:
              - --pool-group
              - inference.networking.x-k8s.io
              - '--pool-name'
              - '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              - '--pool-namespace'
              - '{{ .ObjectMeta.Namespace }}'
              - '--zap-encoder'
              - json
              - '--grpc-port'
              - '9002'
              - '--grpc-health-port'
              - '9003'
              - '--secure-serving'
              - '--model-server-metrics-scheme'
              - https
              - --kv-cache-usage-percentage-metric
              - "vllm:kv_cache_usage_perc"
              - '--config-text'
              - |
                apiVersion: inference.networking.x-k8s.io/v1alpha1
                kind: EndpointPickerConfig
                plugins:
                - type: single-profile-handler
                - type: queue-scorer
                - type: kv-cache-utilization-scorer
                - type: prefix-cache-scorer
                schedulingProfiles:
                - name: default
                  plugins:
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
                  - pluginRef: prefix-cache-scorer
                    weight: 3
            volumeMounts:
              - name: tokenizer-cache
                mountPath: /tmp/tokenizer-cache
              - name: cachi2-cache
                mountPath: /cachi2
        volumes:
          - name: tokenizer-cache
            emptyDir: {}
          - name: cachi2-cache
            emptyDir: {} 
    route: { }
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
  template:
    serviceAccountName: llmd-xeon-sa
    containers:
      - name: main
        image: quay.io/intel_on_openshift/vllm-cpu-rhel9:3.4.0-1777444682
        command: ["bash", "-c"]
        args:
        - |-
          #!/bin/bash
          # Use POD_IP from environment variable (injected via Downward API)
          LAST_OCTET=${POD_IP##*.}
          POD_IDX=$((LAST_OCTET % 4))
          
          # NUMA topology mapping (physical cores only, reserving 1 core per node for VLLM)
          if [ "$POD_IDX" -eq 0 ]; then
              # Node 0: 0-42 -> Reserve 0 -> Bind 1-42
              CORES=$(seq -s, 1 42)
          elif [ "$POD_IDX" -eq 1 ]; then
              # Node 1: 43-85 -> Reserve 43 -> Bind 44-85
              CORES=$(seq -s, 44 85)
          elif [ "$POD_IDX" -eq 2 ]; then
              # Node 2: 86-127 -> Reserve 86 -> Bind 87-127
              CORES=$(seq -s, 87 127)
          else
              # Node 3: 128-170 -> Reserve 128 -> Bind 129-170
              CORES=$(seq -s, 129 170)
          fi
          
          export VLLM_CPU_OMP_THREADS_BIND=$CORES
          echo "=== Pod $HOSTNAME IP=$POD_IP bound to cores: $CORES (index $POD_IDX, last octet: $LAST_OCTET) ==="
          export LD_PRELOAD="/usr/lib64/libomp.so${LD_PRELOAD:+:$LD_PRELOAD}"
          exec vllm serve \
            --model=/mnt/models \
            --served-model-name=Qwen3-0.6B \
            --dtype=bfloat16 \
            --ssl-certfile=/var/run/kserve/tls/tls.crt \
            --ssl-keyfile=/var/run/kserve/tls/tls.key \
            --enable-ssl-refresh
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: HF_HOME
            value: /tmp/hf_home
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "40"
          - name: VLLM_CPU_NUM_OF_RESERVED_CPU
            value: "1"
        resources: {}
          # limits:
          #   cpu: '16'
          #   memory: 32Gi
          # requests:
          #   cpu: '16'
          #   memory: 32Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 8000
          protocol: TCP
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /tmp/hf_home
          name: hf-cache
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 10Gi
    - name: hf-cache
      emptyDir:
        sizeLimit: 5Gi